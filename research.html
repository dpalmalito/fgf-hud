    header {

    .subtitle { font-size: 0.84rem; color: var(--muted); }

    select, button, input {

    .milestone-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px;

      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 14px; margin-bottom: 18px;

    .inv-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .inv-header h2 { font-size: 0.9rem; color: #fff; }
    .inv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 8px; }
    .inv-item {

    .rec-tree { font-size: 0.76rem; color: var(--muted); }
    .rec-unlocks { font-size: 0.76rem; color: #38bdf8; margin-top: 2px; }

let inventory = JSON.parse(localStorage.getItem("fgf_research_inv_v3")) || structuredClone(INITIAL_INVENTORY);
let activeTree = "Alle";

function saveState() {
  localStorage.setItem("fgf_research_nodes_v3", JSON.stringify(nodes));
  localStorage.setItem("fgf_research_inv_v3", JSON.stringify(inventory));
}

function resetData() {
  nodes = structuredClone(INITIAL_DATA);
  inventory = structuredClone(INITIAL_INVENTORY);
  saveState();
  render();
}

function updateInv(id, val) {
  const item = inventory.find(x => x.id === id);
  if (!item) return;
  item.value = Math.max(0, parseInt(val, 10) || 0);
  saveState();
  renderRecommendations();
}

// Prüft, ob alle Pflicht-Voraussetzungen (DAG) erfüllt sind
function checkPrerequisites(node) {
  if (!node.requires || node.requires.length === 0) return { unlocked: true, missingText: "" };
  const missing = [];
  for (const req of node.requires) {
    const parent = nodes.find(x => x.id === req.id);
    if (parent && parent.current < req.lvl) {
      missing.push(`${parent.name} (${parent.current}/${req.lvl})`);
    }
  }
  return missing.length === 0
    ? { unlocked: true, missingText: "" }
    : { unlocked: false, missingText: `Benötigt: ${missing.join(", ")}` };
}

function hasEnoughMat(node) {
  const item = inventory.find(x => x.id === node.reqMat);
  if (!item) return { ok: true, label: "Material OK" };
  return item.value >= node.minMat
    ? { ok: true, label: `${item.label}: ${item.value.toLocaleString("de-DE")}` }
    : { ok: false, label: `${item.label} knapp (${item.value.toLocaleString("de-DE")})` };
}

function calculateScore(node) {
  if (node.current >= node.max || node.running) return -1;
  const prereq = checkPrerequisites(node);
  if (!prereq.unlocked) return -1; // Gesperrte Knoten werden NICHT direkt empfohlen!

  const focus = document.getElementById("focusStyle").value;
  const mode = document.getElementById("goalMode").value;
  let score = node.baseWeight;

  if (node.style === focus) score += 18;
  else if (node.style !== "all") score -= 12;

  if (mode === "t7") {
    if (node.tree === "Combat Craft Modification") score += 16;
    if (node.tag === "HP is King") score += 10;
  } else if (mode === "epoch") {
    if (node.tree === "Epoch of Fusion Seed") score += 26;
    if (node.id === "eco_res4" || node.id === "eco_res5") score += 12;
  } else if (mode === "event") {
    if (node.tree === "Commerce Guild Duel") score += 45;
    if (node.max - node.current === 1) score += 20;
  }

  if (node.max - node.current === 1) score += 10;
  if (!hasEnoughMat(node).ok) score -= 25;

  return score;
}

function updateLevel(id, delta) {
  const n = nodes.find(x => x.id === id);
  if (!n) return;
  n.current = Math.max(0, Math.min(n.max, n.current + delta));
  if (delta > 0 && n.running) n.running = false;
  saveState();
  render();
}

function renderMilestones() {
  // Berechne CCM-% ausgehend vom echten Screenshot-Wert (56.5% bei 55 erledigten Track-Stufen)
  const ccmNodes = nodes.filter(n => n.tree === "Combat Craft Modification");
  const ccmDone = ccmNodes.reduce((s, n) => s + n.current, 0);
  const ccmBaseDone = 55; // Startwert aus Screenshots
  const ccmPct = Math.min(100, +(56.5 + (ccmDone - ccmBaseDone) * 1.45).toFixed(1));
  const missingFor80 = Math.max(0, Math.ceil((80 - ccmPct) / 1.45));

  const t7Ready = nodes.find(n => n.id === "ccm_t7_kin").current >= 10;
  const epoFinal = nodes.find(n => n.id === "epo_final").current >= 1;

  document.getElementById("milestonesGrid").innerHTML = `
    <div class="milestone-card">
      <div class="ms-top">
        <span>80%-Gate: Specialization Trees (Kinetic/Beam/Ion)</span>
        <span style="color:${ccmPct >= 80 ? 'var(--green)' : 'var(--accent)'}">${ccmPct}% / 80%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(100, (ccmPct/80)*100)}%"></div></div>
      <div class="ms-sub">${ccmPct >= 80 ? 'Freigeschaltet! Kinetic Specialization Baum ist offen.' : `Noch ca. ${missingFor80} Stufen in Combat Craft Modification bis zur Freischaltung der 3 Spezialisierungs-Bäume.`}</div>
    </div>
    <div class="milestone-card">
      <div class="ms-top">
        <span>T7 Kinetic &amp; Core 33 (4. Flotten-Slot)</span>
        <span style="color:${t7Ready ? 'var(--green)' : 'var(--gold)'}">${t7Ready ? 'T7 Bereit!' : '1 Stufe bis T7'}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${t7Ready ? 100 : 90}%; background:var(--gold);"></div></div>
      <div class="ms-sub">${epoFinal ? 'Core 35 Cap offen -> Energy Core auf Lvl 33 für 4. Flotte pushen!' : 'T7 Gatekeeper auf 10/10 bringen & danach Epoch of Fusion Seed bis Fusion Power Systems durchziehen.'}</div>
    </div>
  `;
}

function renderInventory() {
  const invGrid = document.getElementById("invGrid");
  invGrid.innerHTML = inventory.map(i => `
    <div class="inv-item">
      <span class="inv-label">${i.label}</span>
      <input type="number" min="0" value="${i.value}" onchange="updateInv('${i.id}', this.value)" />
    </div>
  `).join("");
}

function renderRecommendations() {
  const ranked = [...nodes]
    .map(n => ({ ...n, score: calculateScore(n), mat: hasEnoughMat(n) }))
    .filter(n => n.score > 0)
    .sort((a, b) => b.score - a.score)
    .slice(0, 3);

  const recGrid = document.getElementById("recGrid");
  recGrid.innerHTML = ranked.map((r, idx) => `
    <div class="rec-card">
      <div>
        <div class="rec-top">
          <span class="rec-rank">Empfehlung #${idx + 1} &bull; Score ${r.score}</span>
          <span class="rec-ready ${r.mat.ok ? 'ready-yes' : 'ready-warn'}">${r.mat.ok ? 'Frei &amp; Material OK' : 'Material prüfen'}</span>
        </div>
        <div class="rec-title">${r.name}</div>
        <div class="rec-tree">${r.tree} &bull; ${r.mat.label}</div>
        ${r.unlocks ? `<div class="rec-unlocks">Schaltet frei: ${r.unlocks}</div>` : ''}
      </div>
      <div class="rec-reason">${r.note}</div>
      <div class="rec-action">
        <span class="lvl-text">Stufe: ${r.current} / ${r.max}</span>
        <button class="btn-step" onclick="updateLevel('${r.id}', 1)">+1 Stufe abschließen</button>
      </div>
    </div>
  `).join("");
}

function render() {
  renderMilestones();
  renderInventory();
  renderRecommendations();

  const trees = ["Alle", ...new Set(nodes.map(n => n.tree))];
  const tabsEl = document.getElementById("treeTabs");
  tabsEl.innerHTML = trees.map(t => {
    const subset = t === "Alle" ? nodes : nodes.filter(n => n.tree === t);
    const done = subset.reduce((s, n) => s + n.current, 0);
    const total = subset.reduce((s, n) => s + n.max, 0);
    const pct = Math.round((done / total) * 100);
    return `<div class="tab ${activeTree === t ? 'active' : ''}" onclick="activeTree='${t}'; render();">
      ${t} <span>(${pct}%)</span>
    </div>`;
  }).join("");

  const visible = activeTree === "Alle" ? nodes : nodes.filter(n => n.tree === activeTree);
  const grid = document.getElementById("nodesGrid");
  grid.innerHTML = visible.map(n => {
    const isMaxed = n.current >= n.max;
    const prereq = checkPrerequisites(n);
    const pct = (n.current / n.max) * 100;

    let badge = "";
    if (!prereq.unlocked) badge = `<span class="badge badge-locked">Gesperrt</span>`;
    else if (n.running) badge = `<span class="badge badge-running">Läuft gerade</span>`;
    else if (n.style !== "all") badge = `<span class="badge badge-${n.style}">${n.style}</span>`;
    else badge = `<span class="badge badge-meta">${n.tag}</span>`;

    return `
      <div class="node-card ${isMaxed ? 'maxed' : ''} ${!prereq.unlocked ? 'locked' : ''} ${n.running ? 'active-slot' : ''}">
        <div>
          <div class="node-header">
            <div class="node-name">${n.name}</div>
            ${badge}
          </div>
          <div class="node-meta" style="margin-top:4px;">${n.tree} &bull; ${n.note}</div>
          ${!prereq.unlocked ? `<div class="req-box" style="margin-top:6px;">${prereq.missingText}</div>` : ''}
          ${n.unlocks ? `<div class="unlock-box" style="margin-top:6px;">Schaltet frei: ${n.unlocks}</div>` : ''}
        </div>
        <div>
          <div class="progress-bar" style="margin-bottom:8px;">
            <div class="progress-fill" style="width:${pct}%"></div>
          </div>
          <div class="node-controls">
            <span class="lvl-text">${isMaxed ? 'MAXED' : `${n.current} / ${n.max}`}</span>
            <div class="btn-group">
              <button class="btn-step" onclick="updateLevel('${n.id}', -1)" ${n.current <= 0 ? 'disabled' : ''}>-</button>
              <button class="btn-step" onclick="updateLevel('${n.id}', 1)" ${isMaxed || !prereq.unlocked ? 'disabled' : ''}>+</button>
            </div>
          </div>
        </div>
      </div>
    `;
  }).join("");
}

document.getElementById("focusStyle").addEventListener("change", render);
document.getElementById("goalMode").addEventListener("change", render);
render();
</script>
</body>
</html>
